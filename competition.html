<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Competition | Paws & Prizes</title>

  <style>
    :root {
      --yellow: #f4c542;
      --yellow-dark: #d9a900;
      --cream: #fffaf0;
      --white: #ffffff;
      --charcoal: #242424;
      --muted: #6d6d6d;
      --border: #eee7d7;
      --green: #557a55;
      --shadow: 0 18px 50px rgba(36, 36, 36, 0.10);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* NAVIGATION */

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 250, 240, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      min-height: 78px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .logo-paw {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--yellow);

      display: grid;
      place-items: center;

      font-size: 1.25rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .nav-links a:hover {
      color: var(--yellow-dark);
    }

    .nav-button {
      background: var(--charcoal);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 800;
    }

    .nav-button:hover {
      background: #000;
    }

    /* HERO */

    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 55px 24px 30px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      font-weight: 800;
      color: #555;
    }

    .back-link:hover {
      color: var(--charcoal);
    }

    .competition-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 42px;
      align-items: start;
    }

    /* IMAGE */

    .competition-image-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      background: #eee;
      box-shadow: var(--shadow);
      min-height: 500px;
    }

    .competition-image {
      width: 100%;
      height: 100%;
      min-height: 500px;
      object-fit: cover;
      display: block;
    }

    .hope-badge {
      position: absolute;
      left: 24px;
      bottom: 24px;

      background: var(--yellow);
      color: var(--charcoal);

      padding: 12px 17px;
      border-radius: 999px;

      font-size: 0.9rem;
      font-weight: 900;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
    }

    /* DETAILS */

    .details-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 34px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      background: #fff3bf;
      color: #725900;

      padding: 8px 13px;
      border-radius: 999px;

      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.7px;

      margin-bottom: 18px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    h1 {
      font-size: clamp(2.1rem, 5vw, 4rem);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .description {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    /* PRIZE */

    .prize-box {
      background: var(--charcoal);
      color: white;
      border-radius: 20px;
      padding: 23px;
      margin-bottom: 25px;
    }

    .prize-label {
      color: #ddd;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .prize {
      font-size: 1.55rem;
      font-weight: 900;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat {
      border: 1px solid var(--border);
      background: #fffdf8;
      border-radius: 17px;
      padding: 17px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .stat-value {
      margin-top: 3px;
      font-size: 1.2rem;
      font-weight: 900;
    }

    /* PROGRESS */

    .progress-section {
      margin-bottom: 28px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 9px;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .progress-bar {
      height: 11px;
      border-radius: 999px;
      background: #eee9dc;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--yellow);
      border-radius: inherit;
      transition: width 0.4s ease;
    }

    /* ENTRY SELECTOR */

    .entry-box {
      background: #fffaf0;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .entry-box h2 {
      font-size: 1.15rem;
      margin-bottom: 15px;
    }

    .quantity-row {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      gap: 10px;
      align-items: center;
    }

    .quantity-button {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 15px;
      background: var(--charcoal);
      color: white;
      cursor: pointer;
      font-size: 1.4rem;
      font-weight: 900;
    }

    .quantity-button:hover {
      background: #000;
    }

    .quantity-input {
      width: 100%;
      height: 52px;
      border: 2px solid var(--border);
      border-radius: 15px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      background: white;
      outline: none;
    }

    .quantity-input:focus {
      border-color: var(--yellow);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .total-label {
      color: var(--muted);
      font-weight: 800;
    }

    .total {
      font-size: 1.5rem;
      font-weight: 900;
    }

    .enter-button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--charcoal);
      padding: 17px 22px;
      cursor: pointer;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 10px 25px rgba(244, 197, 66, 0.28);
    }

    .enter-button:hover {
      background: #e9b92c;
      transform: translateY(-1px);
    }

    .small-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 13px;
    }

    /* LOWER CONTENT */

    .lower {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px 24px 80px;
    }

    .lower-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .content-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    .content-card h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .content-card p {
      color: var(--muted);
      white-space: pre-line;
    }

    /* GIVE HOPE */

    .give-hope {
      max-width: 1200px;
      margin: 0 auto 70px;
      padding: 0 24px;
    }

    .hope-panel {
      background: var(--yellow);
      border-radius: 30px;
      padding: 42px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 35px;
    }

    .hope-panel h2 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .hope-panel p {
      max-width: 650px;
      color: #4f430d;
    }

    .hope-paw {
      font-size: 5rem;
    }

    /* FOOTER */

    footer {
      background: var(--charcoal);
      color: white;
      padding: 45px 24px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      justify-content: space-between;
      gap: 25px;
      align-items: center;
    }

    .footer-brand {
      font-weight: 900;
      font-size: 1.1rem;
    }

    .footer-note {
      color: #aaa;
      font-size: 0.85rem;
    }

    /* LOADING / ERROR */

    .loading {
      text-align: center;
      padding: 100px 20px;
      font-weight: 800;
      color: var(--muted);
    }

    .error-box {
      max-width: 700px;
      margin: 80px auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .error-box h1 {
      font-size: 2rem;
      letter-spacing: -1px;
    }

    .error-box p {
      color: var(--muted);
      margin: 15px 0 25px;
    }

    .home-button {
      display: inline-block;
      background: var(--charcoal);
      color: white;
      padding: 13px 20px;
      border-radius: 999px;
      font-weight: 800;
    }

    /* MOBILE */

    @media (max-width: 850px) {
      .nav-links {
        display: none;
      }

      .competition-layout {
        grid-template-columns: 1fr;
      }

      .competition-image-wrap,
      .competition-image {
        min-height: 360px;
      }

      .lower-grid {
        grid-template-columns: 1fr;
      }

      .hope-panel {
        grid-template-columns: 1fr;
      }

      .hope-paw {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .hero {
        padding-top: 30px;
      }

      .details-card {
        padding: 23px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      h1 {
        font-size: 2.3rem;
      }

      .hope-panel {
        padding: 30px;
      }

      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>
    <div class="nav-inner">

      <a href="/" class="logo">
        <span class="logo-paw">🐾</span>
        <span>Paws & Prizes</span>
      </a>

      <div class="nav-links">
        <a href="/#competitions">Competitions</a>
        <a href="/#how-it-works">How It Works</a>
        <a href="/#paw-fund">Paw Fund</a>
        <a href="/" class="nav-button">Back Home</a>
      </div>

    </div>
  </nav>


  <!-- MAIN CONTENT -->

  <main id="page">

    <div class="loading">
      Loading your competition...
    </div>

  </main>


  <!-- FOOTER -->

  <footer>
    <div class="footer-inner">

      <div class="footer-brand">
        🐾 Paws & Prizes
      </div>

      <div class="footer-note">
        Big prizes. More hope. One paw at a time.
      </div>

    </div>
  </footer>


  <script>

    const page = document.getElementById("page");

    /*
      The competition ID comes from the URL.

      Example:

      /competition.html?id=1

      This allows ONE competition page
      to display any competition stored in D1.
    */

    const params = new URLSearchParams(window.location.search);
    const competitionId = params.get("id");


    let competition = null;
    let quantity = 1;


    function formatMoney(value) {

      const number = Number(value || 0);

      return new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP"
      }).format(number);

    }


    function formatDate(value) {

      if (!value) {
        return "To be confirmed";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleDateString("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });

    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getImage() {

      if (competition.image_url && competition.image_url.trim()) {
        return competition.image_url;
      }

      return "https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1200&q=85";

    }


    function renderCompetition() {

      const totalTickets = Number(competition.ticket_quantity || 0);
      const ticketsSold = Number(competition.tickets_sold || 0);

      const ticketsRemaining = Math.max(
        totalTickets - ticketsSold,
        0
      );

      const percentage = totalTickets > 0
        ? Math.min((ticketsSold / totalTickets) * 100, 100)
        : 0;

      const ticketPrice = Number(competition.ticket_price || 0);

      const totalPrice = quantity * ticketPrice;


      document.title =
        `${competition.title || "Competition"} | Paws & Prizes`;


      page.innerHTML = `

        <section class="hero">

          <a href="/" class="back-link">
            ← Back to competitions
          </a>


          <div class="competition-layout">


            <!-- IMAGE -->

            <div class="competition-image-wrap">

              <img
                class="competition-image"
                src="${escapeHtml(getImage())}"
                alt="${escapeHtml(competition.title || "Paws & Prizes competition")}"
                onerror="this.src='https://placehold.co/1200x800/f4c542/242424?text=Paws+%26+Prizes'"
              >

              <div class="hope-badge">
                🐾 Every entry starts with a little hope
              </div>

            </div>


            <!-- DETAILS -->

            <div class="details-card">

              <div class="status">
                <span class="status-dot"></span>
                ${escapeHtml(competition.status || "Live")}
              </div>


              <h1>
                ${escapeHtml(competition.title || "Paws & Prizes Competition")}
              </h1>


              <div class="description">
                ${escapeHtml(competition.description || "Enter for your chance to win something wonderful.")}
              </div>


              <div class="prize-box">

                <div class="prize-label">
                  Prize
                </div>

                <div class="prize">
                  ${escapeHtml(competition.prize || "Prize to be announced")}
                </div>

              </div>


              <div class="stats">

                <div class="stat">

                  <div class="stat-label">
                    Entry price
                  </div>

                  <div class="stat-value">
                    ${formatMoney(ticketPrice)}
                  </div>

                </div>


                <div class="stat">

                  <div class="stat-label">
                    Tickets remaining
                  </div>

                  <div class="stat-value">
                    ${ticketsRemaining.toLocaleString("en-GB")}
                  </div>

                </div>


                <div class="stat">

                  <div class="stat-label">
                    Closing date
                  </div>

                  <div class="stat-value">
                    ${formatDate(competition.closing_date)}
                  </div>

                </div>


                <div class="stat">

                  <div class="stat-label">
                    Prize value
                  </div>

                  <div class="stat-value">
                    ${formatMoney(competition.prize_value)}
                  </div>

                </div>

              </div>


              <div class="progress-section">

                <div class="progress-top">

                  <span>
                    Entries sold
                  </span>

                  <span>
                    ${ticketsSold.toLocaleString("en-GB")}
                    /
                    ${totalTickets.toLocaleString("en-GB")}
                  </span>

                </div>

                <div class="progress-bar">

                  <div
                    class="progress-fill"
                    style="width: ${percentage}%"
                  ></div>

                </div>

              </div>


              <div class="entry-box">

                <h2>
                  Choose your entries
                </h2>


                <div class="quantity-row">

                  <button
                    class="quantity-button"
                    type="button"
                    onclick="changeQuantity(-1)"
                  >
                    −
                  </button>


                  <input
                    id="quantity"
                    class="quantity-input"
                    type="number"
                    min="1"
                    max="${Math.max(ticketsRemaining, 1)}"
                    value="1"
                    oninput="setQuantity(this.value)"
                  >


                  <button
                    class="quantity-button"
                    type="button"
                    onclick="changeQuantity(1)"
                  >
                    +
                  </button>

                </div>


                <div class="total-row">

                  <span class="total-label">
                    Your total
                  </span>

                  <span
                    id="total"
                    class="total"
                  >
                    ${formatMoney(ticketPrice)}
                  </span>

                </div>

              </div>


              <button
                class="enter-button"
                type="button"
                onclick="continueToEntry()"
              >
                Continue to Entry →
              </button>


              <div class="small-note">
                No payment is taken on this demo.
              </div>

            </div>

          </div>

        </section>


        <section class="lower">

          <div class="lower-grid">


            <div class="content-card">

              <h2>
                How this competition works
              </h2>

              <p>
                ${escapeHtml(
                  competition.rules ||
                  "Choose your entries and complete your entry before the competition closes. Winners will be selected after the competition has ended."
                )}
              </p>

            </div>


            <div class="content-card">

              <h2>
                Your chance to win
              </h2>

              <p>
                Every entry gives you a chance to win the prize shown above.

                This is not an instant-win game. The winner selection takes place after the competition has ended, in accordance with the competition rules.

                Full entry and winner information will be provided before any real competition goes live.
              </p>

            </div>


          </div>

        </section>


        <section class="give-hope">

          <div class="hope-panel">

            <div>

              <h2>
                Win something wonderful.
                Help make something better.
              </h2>

              <p>
                Paws & Prizes is being built around a simple idea:
                every competition should have a little more heart.
                As we grow, our Paw Fund will help us support animals
                and the people who care for them.
              </p>

            </div>

            <div class="hope-paw">
              🐾
            </div>

          </div>

        </section>

      `;

    }


    function changeQuantity(amount) {

      const input = document.getElementById("quantity");

      if (!input) {
        return;
      }

      let newQuantity =
        Number(input.value || 1) + amount;

      const max =
        Math.max(Number(competition.ticket_quantity || 1) - Number(competition.tickets_sold || 0), 1);

      newQuantity =
        Math.max(1, Math.min(newQuantity, max));

      quantity = newQuantity;

      input.value = newQuantity;

      updateTotal();

    }


    function setQuantity(value) {

      let newQuantity = Number(value);

      if (!Number.isFinite(newQuantity) || newQuantity < 1) {
        newQuantity = 1;
      }

      const max =
        Math.max(Number(competition.ticket_quantity || 1) - Number(competition.tickets_sold || 0), 1);

      newQuantity =
        Math.min(Math.floor(newQuantity), max);

      quantity = newQuantity;

      document.getElementById("quantity").value =
        newQuantity;

      updateTotal();

    }


    function updateTotal() {

      const total =
        quantity * Number(competition.ticket_price || 0);

      const totalElement =
        document.getElementById("total");

      if (totalElement) {
        totalElement.textContent =
          formatMoney(total);
      }

    }


    function continueToEntry() {

      /*
        DEMO ONLY.

        We are deliberately NOT connecting
        this to Stripe yet.

        Later this button will take the customer
        through:

        Account
        ↓
        Ticket allocation
        ↓
        Stripe checkout
        ↓
        Confirmation
      */

      alert(
        "This is currently a pre-launch demo. No payment has been taken."
      );

    }


    async function loadCompetition() {

      if (!competitionId) {

        page.innerHTML = `

          <div class="error-box">

            <h1>
              Competition not found
            </h1>

            <p>
              No competition was selected.
              Please return to the competitions page.
            </p>

            <a
              href="/"
              class="home-button"
            >
              Back to Paws & Prizes
            </a>

          </div>

        `;

        return;
      }


      try {

        const response =
          await fetch("/api/competitions");


        if (!response.ok) {
          throw new Error("Could not load competitions.");
        }


        const competitions =
          await response.json();


        competition =
          competitions.find(
            item => String(item.id) === String(competitionId)
          );


        if (!competition) {
          throw new Error("Competition not found.");
        }


        renderCompetition();

      } catch (error) {

        console.error(error);


        page.innerHTML = `

          <div class="error-box">

            <h1>
              We couldn't load that competition
            </h1>

            <p>
              Please try again or return to the Paws & Prizes homepage.
            </p>

            <a
              href="/"
              class="home-button"
            >
              Back to Paws & Prizes
            </a>

          </div>

        `;

      }

    }


    loadCompetition();

  </script>

</body>
</html>
