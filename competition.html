
<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="Discover the prizes and competition details at Paws & Prizes.">
  <title>Competition | Paws & Prizes</title>

  <style>
    :root {
      --yellow: #f4c542;
      --yellow-dark: #d9a900;
      --cream: #fffaf0;
      --white: #fff;
      --charcoal: #242424;
      --muted: #6d6d6d;
      --border: #eee7d7;
      --green: #557a55;
      --red: #a52b2b;
      --shadow: 0 18px 50px rgba(36,36,36,.10);
      --radius: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid #8b6a00;
      outline-offset: 3px;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,250,240,.97);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1200px;
      min-height: 76px;
      padding: 12px 24px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .logo-paw {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--yellow);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: .92rem;
      font-weight: 750;
    }

    .nav-links a:hover, .back-link:hover { color: var(--yellow-dark); }

    .nav-button, .home-button {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 999px;
      background: var(--charcoal);
      color: white;
      font-weight: 800;
    }

    .hero, .lower, .give-hope {
      max-width: 1200px;
      margin: auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .hero { padding-top: 42px; padding-bottom: 28px; }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      font-weight: 800;
    }

    .competition-layout {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 34px;
      align-items: start;
    }

    .competition-image-wrap {
      position: relative;
      min-height: 420px;
      overflow: hidden;
      border-radius: 28px;
      background: #eee;
      box-shadow: var(--shadow);
    }

    .competition-image {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 420px;
      object-fit: cover;
    }

    .hope-badge {
      position: absolute;
      left: 20px;
      bottom: 20px;
      max-width: calc(100% - 40px);
      padding: 11px 16px;
      border-radius: 999px;
      background: var(--yellow);
      font-weight: 850;
      box-shadow: 0 8px 24px #0002;
    }

    .details-card, .content-card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eaf3e8;
      color: #345b35;
      font-size: .78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.08;
      letter-spacing: -1.5px;
      overflow-wrap: anywhere;
    }

    .description { color: var(--muted); margin-bottom: 24px; }

    .prize-box {
      padding: 22px;
      margin-bottom: 22px;
      border-radius: 19px;
      background: var(--charcoal);
      color: white;
    }

    .prize-label, .stat-label {
      font-size: .74rem;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .prize-label { color: #ddd; }
    .prize { font-size: 1.45rem; font-weight: 900; overflow-wrap: anywhere; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 11px;
      margin-bottom: 22px;
    }

    .stat {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fffdf8;
      min-width: 0;
    }

    .stat-label { color: var(--muted); }
    .stat-value { margin-top: 4px; font-size: 1.08rem; font-weight: 900; overflow-wrap: anywhere; }

    .progress-section { margin-bottom: 24px; }
    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: .86rem;
      font-weight: 800;
    }

    .progress-bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #eee9dc;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--yellow);
      transition: width .25s ease;
    }

    .entry-box {
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: var(--cream);
    }

    .entry-box h2 { margin-bottom: 14px; font-size: 1.12rem; }

    .quantity-row {
      display: grid;
      grid-template-columns: 48px minmax(0,1fr) 48px;
      gap: 9px;
    }

    .quantity-button {
      height: 48px;
      border: 0;
      border-radius: 13px;
      background: var(--charcoal);
      color: white;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
    }

    .quantity-button:disabled { opacity: .35; cursor: not-allowed; }

    .quantity-input {
      width: 100%;
      min-width: 0;
      height: 48px;
      border: 2px solid var(--border);
      border-radius: 13px;
      background: white;
      text-align: center;
      font-weight: 900;
      font-size: 1.15rem;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
      margin-top: 16px;
      border-top: 1px solid var(--border);
    }

    .total-label { color: var(--muted); font-weight: 800; }
    .total { font-size: 1.4rem; font-weight: 900; }

    .enter-button {
      width: 100%;
      padding: 16px 20px;
      border: 0;
      border-radius: 999px;
      background: var(--yellow);
      color: var(--charcoal);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 22px #f4c54244;
    }

    .enter-button:hover:not(:disabled) { background: #e9b92c; }
    .enter-button:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }

    .small-note {
      margin-top: 12px;
      color: var(--muted);
      text-align: center;
      font-size: .78rem;
    }

    .lower { padding-top: 24px; padding-bottom: 65px; }
    .lower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .content-card { box-shadow: none; }
    .content-card h2 { margin-bottom: 12px; font-size: 1.35rem; }
    .content-card p { color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }

    .give-hope { padding-bottom: 65px; }

    .hope-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 36px;
      border-radius: 28px;
      background: var(--yellow);
    }

    .hope-panel h2 {
      margin-bottom: 12px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    .hope-panel p { max-width: 680px; color: #4f430d; }
    .hope-paw { font-size: 4rem; }

    footer { padding: 36px 24px; background: var(--charcoal); color: white; }
    .footer-inner {
      max-width: 1152px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .footer-brand { font-weight: 900; }
    .footer-note { color: #ccc; font-size: .85rem; }

    .message {
      max-width: 700px;
      margin: 70px auto;
      padding: 36px 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: white;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .message h1 { font-size: 2rem; letter-spacing: -1px; }
    .message p { margin: 12px 0 22px; color: var(--muted); }
    .message .home-button { margin-top: 4px; }
    .error-text { color: var(--red); }

    @media (max-width: 850px) {
      .nav-links { display: none; }
      .competition-layout, .lower-grid { grid-template-columns: 1fr; }
      .competition-image-wrap, .competition-image { min-height: 330px; }
    }

    @media (max-width: 520px) {
      .nav-inner { min-height: 66px; padding: 10px 16px; }
      .hero, .lower, .give-hope { padding-left: 16px; padding-right: 16px; }
      .hero { padding-top: 24px; }
      .details-card, .content-card { padding: 21px; }
      .competition-image-wrap, .competition-image { min-height: 260px; }
      .hope-panel { grid-template-columns: 1fr; padding: 25px; }
      .hope-paw { display: none; }
      .footer-inner { align-items: flex-start; flex-direction: column; }
      .stat { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo" aria-label="Paws & Prizes home">
        <span class="logo-paw" aria-hidden="true">🐾</span>
        <span>Paws & Prizes</span>
      </a>

      <div class="nav-links">
        <a href="/#competitions">Competitions</a>
        <a href="/#how-it-works">How It Works</a>
        <a href="/#paw-fund">Paw Fund</a>
        <a href="/" class="nav-button">Back Home</a>
      </div>
    </div>
  </nav>

  <main id="page" aria-live="polite">
    <div class="message">
      <p>🐾 Loading competition details…</p>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div class="footer-brand">🐾 Paws & Prizes</div>
      <div class="footer-note">Big prizes. More hope. One paw at a time.</div>
    </div>
  </footer>

  <script>
    "use strict";

    const page = document.getElementById("page");
    const params = new URLSearchParams(window.location.search);
    const competitionId = params.get("id");

    let competition = null;
    let quantity = 1;

    const fallbackImage =
      "https://images.unsplash.com/photo-1552053831-71594a27632d?auto=format&fit=crop&w=1200&q=85";

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatMoney(value) {
      const number = Number(value);
      if (!Number.isFinite(number) || number < 0) return "To be confirmed";

      return new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP"
      }).format(number);
    }

    function formatDate(value) {
      if (!value) return "To be confirmed";

      const text = String(value);
      let date;

      // Parse date-only values as local dates to avoid a timezone shift.
      const dateOnly = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

      if (dateOnly) {
        date = new Date(
          Number(dateOnly[1]),
          Number(dateOnly[2]) - 1,
          Number(dateOnly[3])
        );
      } else {
        date = new Date(text);
      }

      if (Number.isNaN(date.getTime())) return "To be confirmed";

      return new Intl.DateTimeFormat("en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(date);
    }

    function safeImageUrl(value) {
      if (!value || typeof value !== "string") return fallbackImage;

      try {
        const url = new URL(value, window.location.origin);
        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch (_) {}

      return fallbackImage;
    }

    function getInventory() {
      const total = Number(competition?.ticket_quantity);
      const sold = Number(competition?.tickets_sold);

      if (!Number.isSafeInteger(total) || total < 0 ||
          !Number.isSafeInteger(sold) || sold < 0) {
        return { total: 0, sold: 0, remaining: 0 };
      }

      return {
        total,
        sold: Math.min(sold, total),
        remaining: Math.max(total - sold, 0)
      };
    }

    function getTicketPrice() {
      const price = Number(competition?.ticket_price);
      return Number.isFinite(price) && price >= 0 ? price : 0;
    }

    function showMessage(title, message, isError = false) {
      document.title = `${title} | Paws & Prizes`;

      page.innerHTML = `
        <section class="hero">
          <div class="message">
            <h1>${escapeHtml(title)}</h1>
            <p>${escapeHtml(message)}</p>
            <a href="/" class="home-button">Back to Paws & Prizes</a>
          </div>
        </section>
      `;

      if (isError) {
        const heading = page.querySelector("h1");
        if (heading) heading.classList.add("error-text");
      }
    }

    function renderCompetition() {
      const inventory = getInventory();
      const ticketPrice = getTicketPrice();
      const soldOut = inventory.remaining < 1;
      const percentage = inventory.total > 0
        ? Math.min(100, (inventory.sold / inventory.total) * 100)
        : 0;

      // Never show an entry selector with no available entries.
      quantity = soldOut
        ? 0
        : Math.min(Math.max(1, quantity), inventory.remaining);

      document.title =
        `${competition.title || "Competition"} | Paws & Prizes`;

      const imageUrl = safeImageUrl(competition.image_url);
      const title = competition.title || "Paws & Prizes Competition";
      const description = competition.description ||
        "Discover this competition from Paws & Prizes.";

      const rules = competition.rules ||
        "Competition rules and full entry information will be published before any real competition opens.";

      const prize = competition.prize || "Prize to be announced";
      const prizeValue = competition.prize_value;
      const status = competition.status || "Live";

      page.innerHTML = `
        <section class="hero">
          <a href="/#competitions" class="back-link">← Back to competitions</a>

          <div class="competition-layout">
            <div class="competition-image-wrap">
              <img
                id="competition-image"
                class="competition-image"
                src="${escapeHtml(imageUrl)}"
                alt="${escapeHtml(title)}"
                loading="eager"
                referrerpolicy="no-referrer"
              >
              <div class="hope-badge">🐾 Every entry starts with a little hope</div>
            </div>

            <section class="details-card" aria-labelledby="competition-title">
              <div class="status">
                <span class="status-dot" aria-hidden="true"></span>
                ${escapeHtml(status)}
              </div>

              <h1 id="competition-title">${escapeHtml(title)}</h1>
              <p class="description">${escapeHtml(description)}</p>

              <div class="prize-box">
                <div class="prize-label">Prize</div>
                <div class="prize">${escapeHtml(prize)}</div>
              </div>

              <div class="stats">
                <div class="stat">
                  <div class="stat-label">Entry price</div>
                  <div class="stat-value">${formatMoney(ticketPrice)}</div>
                </div>
                <div class="stat">
                  <div class="stat-label">Tickets remaining</div>
                  <div class="stat-value">${inventory.remaining.toLocaleString("en-GB")}</div>
                </div>
                <div class="stat">
                  <div class="stat-label">Closing date</div>
                  <div class="stat-value">${escapeHtml(formatDate(competition.closing_date))}</div>
                </div>
                <div class="stat">
                  <div class="stat-label">Prize value</div>
                  <div class="stat-value">${formatMoney(prizeValue)}</div>
                </div>
              </div>

              <div class="progress-section">
                <div class="progress-top">
                  <span>Entries sold</span>
                  <span>${inventory.sold.toLocaleString("en-GB")} / ${inventory.total.toLocaleString("en-GB")}</span>
                </div>
                <div
                  class="progress-bar"
                  role="progressbar"
                  aria-label="Tickets sold"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="${Math.round(percentage)}"
                >
                  <div class="progress-fill" style="width:${percentage}%"></div>
                </div>
              </div>

              <div class="entry-box">
                <h2>Choose your entries</h2>

                <div class="quantity-row">
                  <button
                    id="decrease"
                    class="quantity-button"
                    type="button"
                    aria-label="Decrease entry quantity"
                    ${soldOut || quantity <= 1 ? "disabled" : ""}
                  >−</button>

                  <input
                    id="quantity"
                    class="quantity-input"
                    type="number"
                    inputmode="numeric"
                    min="${soldOut ? 0 : 1}"
                    max="${inventory.remaining}"
                    step="1"
                    value="${quantity}"
                    aria-label="Number of entries"
                    ${soldOut ? "disabled" : ""}
                  >

                  <button
                    id="increase"
                    class="quantity-button"
                    type="button"
                    aria-label="Increase entry quantity"
                    ${soldOut || quantity >= inventory.remaining ? "disabled" : ""}
                  >+</button>
                </div>

                <div class="total-row">
                  <span class="total-label">Your total</span>
                  <output id="total" class="total" aria-live="polite">${formatMoney(quantity * ticketPrice)}</output>
                </div>
                <p id="quantity-error" class="small-note error-text" hidden></p>
              </div>

              <button
                id="enter-button"
                class="enter-button"
                type="button"
                ${soldOut ? "disabled" : ""}
              >${soldOut ? "Competition sold out" : "Continue to Entry →"}</button>

              <p class="small-note">
                Pre-launch demo only. This page does not take payments,
                reserve tickets or create an entry.
              </p>
            </section>
          </div>
        </section>

        <section class="lower">
          <div class="lower-grid">
            <article class="content-card">
              <h2>Competition rules</h2>
              <p>${escapeHtml(rules)}</p>
            </article>

            <article class="content-card">
              <h2>Your chance to win</h2>
              <p>
                This is a pre-launch preview. No purchase or entry is being
                accepted through this page. Before any competition opens,
                the final entry process, eligibility requirements, closing
                arrangements and winner-selection rules must be clearly
                published and the entry system properly tested.
              </p>
            </article>
          </div>
        </section>

        <section class="give-hope">
          <div class="hope-panel">
            <div>
              <h2>Win something wonderful. Help make something better.</h2>
              <p>
                Paws & Prizes is being built around a simple idea:
                competitions with a little more heart. As the business grows,
                our Paw Fund aims to support animals and the people who care
                for them. The fund's contribution and use will be explained
                clearly before launch.
              </p>
            </div>
            <div class="hope-paw" aria-hidden="true">🐾</div>
          </div>
        </section>
      `;

      const image = document.getElementById("competition-image");
      image.addEventListener("error", () => {
        image.removeAttribute("src");
        image.alt = "Paws & Prizes competition image unavailable";
        image.style.objectFit = "contain";
        image.style.padding = "30px";
        image.style.background = "#fffaf0";
      }, { once: true });

      const input = document.getElementById("quantity");
      const error = document.getElementById("quantity-error");

      function updateQuantity(nextValue) {
        if (inventory.remaining < 1) return;

        const parsed = Number(nextValue);

        if (!Number.isSafeInteger(parsed) || parsed < 1) {
          error.textContent = `Choose a whole number between 1 and ${inventory.remaining}.`;
          error.hidden = false;
          return;
        }

        if (parsed > inventory.remaining) {
          error.textContent =
            `Only ${inventory.remaining.toLocaleString("en-GB")} entries remain.`;
          error.hidden = false;
          return;
        }

        error.textContent = "";
        error.hidden = true;
        quantity = parsed;

        input.value = String(quantity);
        document.getElementById("total").textContent =
          formatMoney(quantity * ticketPrice);

        document.getElementById("decrease").disabled = quantity <= 1;
        document.getElementById("increase").disabled =
          quantity >= inventory.remaining;
      }

      document.getElementById("decrease").addEventListener("click", () => {
        updateQuantity(quantity - 1);
      });

      document.getElementById("increase").addEventListener("click", () => {
        updateQuantity(quantity + 1);
      });

      input.addEventListener("change", () => {
        updateQuantity(input.value);
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          input.blur();
        }
      });

      document.getElementById("enter-button").addEventListener("click", () => {
        // Deliberately no checkout, ticket reservation or payment yet.
        alert(
          "Paws & Prizes is still in pre-launch testing. No entry has been created and no payment has been taken."
        );
      });
    }

    async function loadCompetition() {
      if (!competitionId || !/^\d+$/.test(competitionId)) {
        showMessage(
          "Competition not found",
          "Please choose a competition from the Paws & Prizes homepage."
        );
        return;
      }

      try {
        const response = await fetch("/api/competitions", {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store",
          credentials: "same-origin"
        });

        if (!response.ok) {
          throw new Error("The competition list could not be loaded.");
        }

        const competitions = await response.json();

        if (!Array.isArray(competitions)) {
          throw new Error("The competition response was not valid.");
        }

        // The public API should return live competitions only.
        competition = competitions.find(
          item => String(item.id) === String(competitionId)
        );

        if (!competition) {
          showMessage(
            "Competition unavailable",
            "This competition may not be live yet, may have closed, or may no longer be available."
          );
          return;
        }

        renderCompetition();
      } catch (error) {
        console.error("Competition loading failed:", error);
        showMessage(
          "We couldn't load that competition",
          "Please try again shortly or return to the Paws & Prizes homepage.",
          true
        );
      }
    }

    loadCompetition();
  </script>
</body>
</html>
